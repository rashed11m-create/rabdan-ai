<script type="module">
const MODEL = "Qwen3-0.6B-q4f16_1-MLC";

const startBtn = document.getElementById("start");
const sendBtn = document.getElementById("send");
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const setup = document.getElementById("setup");

let engine = null;
let busy = false;

const systemPrompt = `
أنت ربدان، مساعد ذكاء اصطناعي إماراتي.
تحدث باللهجة الإماراتية الطبيعية والواضحة.
إذا كتب المستخدم بالإنجليزية فأجب بالإنجليزية.
كن ودوداً ومحترماً ومختصراً عند الأسئلة البسيطة.
لا تدّع أنك إنسان أو أنك تعرف معلومات مباشرة عن العالم.
إذا لم تعرف الإجابة فقل ذلك بوضوح ولا تخترع معلومات.
اسمك ربدان AI.
`;

let messages = [{role:"system",content:systemPrompt}];

function addMessage(role,text){
 const box=document.createElement("div");
 box.className="msg "+role;
 const label=document.createElement("div");
 label.className="label";
 label.textContent=role==="user"?"أنت":"ربدان AI";
 const body=document.createElement("div");
 body.textContent=text;
 box.append(label,body);
 chat.appendChild(box);
 chat.scrollTop=chat.scrollHeight;
 return body;
}

function saveChat(){
 try{localStorage.setItem("rabdan_chat",JSON.stringify(messages.slice(1)))}catch(e){}
}

function loadChat(){
 try{
  const saved=JSON.parse(localStorage.getItem("rabdan_chat")||"[]");
  saved.forEach(m=>{
   if(m.role==="user"||m.role==="assistant"){
    messages.push(m);
    addMessage(m.role,m.content);
   }
  });
 }catch(e){}
}

startBtn.addEventListener("click",async()=>{
 if(engine||busy)return;
 startBtn.disabled=true;
 status.textContent="جاري التحميل...";
 progress.textContent="جاري الاتصال بمحرك WebLLM...";

 try{
  if(!navigator.gpu)throw new Error("WebGPU غير مدعوم في هذا المتصفح.");

  const webllm=await import("https://esm.run/@mlc-ai/web-llm");

  const modelExists=webllm.prebuiltAppConfig.model_list.some(
   item=>item.model_id===MODEL
  );

  if(!modelExists){
   throw new Error("الموديل غير موجود في قائمة WebLLM الحالية: "+MODEL);
  }

  engine=await webllm.CreateMLCEngine(MODEL,{
   initProgressCallback:(report)=>{
    progress.textContent=report.text||"جاري تحميل النموذج...";
   }
  });

  status.textContent="جاهز";
  progress.textContent="تم تشغيل ربدان بنجاح 🇦🇪";
  setup.style.borderColor="#36d6a5";
  startBtn.textContent="تم التشغيل";
  input.disabled=false;
  sendBtn.disabled=false;
  input.focus();

 }catch(error){
  engine=null;
  status.textContent="تعذر التشغيل";
  progress.textContent="الخطأ: "+(error.message||String(error));
  startBtn.disabled=false;
 }
});

async function sendMessage(){
 const text=input.value.trim();
 if(!text||!engine||busy)return;

 busy=true;
 input.value="";
 sendBtn.disabled=true;
 input.disabled=true;

 addMessage("user",text);
 messages.push({role:"user",content:text});
 const answerBox=addMessage("assistant","جاري التفكير...");

 try{
  const result=await engine.chat.completions.create({
   messages,
   temperature:0.7,
   max_tokens:500
  });

  const answer=result.choices?.[0]?.message?.content||"ما قدرت أطلع إجابة.";
  answerBox.textContent=answer;
  messages.push({role:"assistant",content:answer});
  saveChat();
 }catch(error){
  answerBox.textContent="صار خطأ: "+(error.message||String(error));
 }

 busy=false;
 sendBtn.disabled=false;
 input.disabled=false;
 input.focus();
}

sendBtn.addEventListener("click",sendMessage);
input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

document.getElementById("clear").addEventListener("click",()=>{
 messages=[{role:"system",content:systemPrompt}];
 chat.innerHTML="";
 localStorage.removeItem("rabdan_chat");
});

loadChat();
</script>
