<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RABDAN AI 🇦🇪</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;text-align:center;border-bottom:1px solid #263347}
header h2{color:#57e0c0;margin:0}
header p{color:#9aaabd;font-size:12px}
main{max-width:750px;margin:auto;padding:20px}
#status{text-align:center;color:#57e0c0;font-size:13px;margin:15px}
#chat{height:60vh;overflow-y:auto;padding:10px}
.msg{padding:13px 16px;border-radius:14px;margin:12px 0;line-height:1.8;white-space:pre-wrap}
.user{background:#183343;margin-right:35px}
.bot{background:#152033;margin-left:35px}
.controls{display:flex;gap:8px}
textarea{flex:1;background:#142239;color:white;border:1px solid #35465b;border-radius:12px;padding:14px;font-size:15px;resize:none}
button{background:#57e0c0;color:#07151b;border:0;border-radius:12px;padding:12px 18px;font-weight:bold}
button:disabled{opacity:.5}
small{display:block;text-align:center;color:#8292a8;margin-top:12px}
</style>
</head>
<body>

<header>
<h2>🇦🇪 RABDAN AI</h2>
<p>ذكاء اصطناعي مستقل · يعمل على جهازك</p>
</header>

<main>
<div id="status">اضغط تشغيل ربدان لتحميل النموذج</div>
<div style="text-align:center">
<button id="start" onclick="startAI()">تشغيل ربدان</button>
</div>

<div id="chat"></div>

<div class="controls">
<textarea id="input" rows="2" placeholder="اسأل ربدان..."></textarea>
<button id="send" onclick="sendMessage()" disabled>إرسال</button>
</div>
<small>المحادثات محفوظة محلياً في هذا المتصفح.</small>
</main>

<script type="module">
import { CreateMLCEngine } from
"https://esm.run/@mlc-ai/web-llm";

const MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
let engine = null;

const status = document.getElementById("status");
const start = document.getElementById("start");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const input = document.getElementById("input");

let history = JSON.parse(localStorage.getItem("rabdan_history") || "[]");

function showMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

history.forEach(m => showMessage(
  m.content,
  m.role === "user" ? "user" : "bot"
));

async function startAI() {
  start.disabled = true;
  status.textContent = "جاري تحميل عقل ربدان... قد يستغرق التحميل وقتاً.";

  try {
    engine = await CreateMLCEngine(MODEL, {
      initProgressCallback: (progress) => {
        status.textContent = progress.text || "جاري التحميل...";
      }
    });

    status.textContent = "ربدان جاهز! 🇦🇪";
    send.disabled = false;
    start.textContent = "تم التشغيل";
  } catch (error) {
    status.textContent = "تعذر التشغيل: " + error.message;
    start.disabled = false;
  }
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || !engine) return;

  input.value = "";
  send.disabled = true;

  showMessage(text, "user");

  history.push({role:"user",content:text});

  const systemPrompt = `
أنت ربدان، مساعد ذكاء اصطناعي إماراتي خاص.
تحدث بالعربية واللهجة الإماراتية عندما يناسب المستخدم.
كن محترماً وواضحاً ومفيداً.
إذا سُئلت عن شيء لا تعرفه فلا تخترع إجابة.
`;

  try {
    const messages = [
      {role:"system",content:systemPrompt},
      ...history.slice(-12)
    ];

    const reply = await engine.chat.completions.create({
      messages,
      temperature:0.7,
      max_tokens:400
    });

    const answer = reply.choices[0].message.content;

    showMessage(answer, "bot");
    history.push({role:"assistant",content:answer});

    localStorage.setItem("rabdan_history",JSON.stringify(history));
  } catch (error) {
    showMessage("صار خطأ أثناء الرد. حاول مرة ثانية.", "bot");
  }

  send.disabled = false;
}

window.startAI = startAI;
window.sendMessage = sendMessage;
</script>
</body>
</html>
