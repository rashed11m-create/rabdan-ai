<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>RABDAN AI 🇦🇪</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:22px 18px;text-align:center;border-bottom:1px solid #29364a}
h1{margin:0;font-size:27px;letter-spacing:1px}
header p{color:#aab6c8;margin:8px 0 0;font-size:14px}
main{max-width:760px;margin:auto;padding:18px}
#status{background:#1b293d;border:1px solid #30435e;border-radius:12px;padding:13px;margin-bottom:14px;color:#cbd5e1;font-size:14px}
button{border:0;border-radius:10px;padding:13px 17px;font-size:15px;font-weight:700;cursor:pointer}
#start{width:100%;background:#d6ad62;color:#172033}
#progress{height:7px;background:#26364d;border-radius:9px;margin-top:12px;overflow:hidden}
#bar{height:100%;width:0;background:#d6ad62;transition:width .3s}
#chat{height:55vh;min-height:300px;overflow:auto;margin:18px 0;padding:12px;background:#152235;border:1px solid #293b54;border-radius:14px}
.msg{padding:12px 14px;margin:10px 0;border-radius:13px;white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
.user{background:#344966;margin-left:25px}
.bot{background:#26364b;margin-right:25px}
#form{display:flex;gap:8px}
#input{flex:1;min-width:0;background:#1b293d;color:white;border:1px solid #3a4c65;border-radius:10px;padding:13px;font-size:16px}
#send{background:#d6ad62;color:#172033}
#send:disabled,#start:disabled{opacity:.5}
#clear{background:#26364b;color:#e5e7eb;margin-top:12px;width:100%}
.note{text-align:center;color:#8292a8;font-size:12px;margin-top:16px}
</style>
</head>
<body>
<header>
<h1>RABDAN AI 🇦🇪</h1>
<p>مساعدك الذكي — بهوية إماراتية</p>
</header>

<main>
<div id="status">ربدان غير مشغّل. اضغط تشغيل لتحميل الذكاء الاصطناعي.</div>
<button id="start">تشغيل ربدان</button>
<div id="progress"><div id="bar"></div></div>
<div id="chat">
<div class="msg bot">مرحبا بك، أنا ربدان. شغّلني وخلنا نبدأ 🇦🇪</div>
</div>
<form id="form">
<input id="input" placeholder="اكتب رسالتك..." autocomplete="off">
<button id="send" disabled>إرسال</button>
</form>
<button id="clear">مسح المحادثة</button>
<div class="note">يعمل النموذج محلياً على جهازك عبر WebGPU.</div>
</main>

<script type="module">
const MODEL = "Qwen3-0.6B-q4f16_1-MLC";

const statusBox = document.getElementById("status");
const startBtn = document.getElementById("start");
const bar = document.getElementById("bar");
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const form = document.getElementById("form");
const clearBtn = document.getElementById("clear");

let engine = null;
let busy = false;
let history = [];

const systemPrompt = `
أنت ربدان AI، مساعد ذكي بهوية إماراتية.
تحدث باللهجة الإماراتية الطبيعية عندما يتحدث المستخدم بالعربية.
كن ودوداً ومحترماً وواضحاً، وأجب مباشرة دون إطالة غير ضرورية.
إذا تحدث المستخدم بالإنجليزية فأجبه بالإنجليزية.
لا تدّعِ أنك تعرف معلومات لا تعرفها.
`;

function addMessage(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  div.textContent = content;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function startRabdan() {
  if (engine || busy) return;

  busy = true;
  startBtn.disabled = true;
  statusBox.textContent = "جاري تجهيز ربدان...";
  bar.style.width = "2%";

  try {
    if (!navigator.gpu) {
      throw new Error("WebGPU غير مدعوم في هذا المتصفح.");
    }

    const webllm = await import(
      "https://esm.run/@mlc-ai/web-llm@0.2.88"
    );

    const modelExists = webllm.prebuiltAppConfig.model_list.some(
      item => item.model_id === MODEL
    );

    if (!modelExists) {
      throw new Error("نموذج Qwen3 غير موجود في نسخة المكتبة.");
    }

    engine = await webllm.CreateMLCEngine(MODEL, {
      initProgressCallback: (report) => {
        statusBox.textContent = report.text || "جاري تحميل النموذج...";
        if (typeof report.progress === "number") {
          bar.style.width = Math.round(report.progress * 100) + "%";
        }
      }
    });

    bar.style.width = "100%";
    statusBox.textContent = "ربدان جاهز للمحادثة 🇦🇪";
    startBtn.textContent = "ربدان يعمل";
    sendBtn.disabled = false;

  } catch (error) {
    engine = null;
    statusBox.textContent = "خطأ: " + (error?.message || String(error));
    startBtn.disabled = false;
    startBtn.textContent = "إعادة المحاولة";
    bar.style.width = "0%";
  } finally {
    busy = false;
  }
}

startBtn.addEventListener("click", startRabdan);

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const text = input.value.trim();
  if (!text || !engine || busy) return;

  input.value = "";
  addMessage("user", text);
  history.push({ role: "user", content: text });

  busy = true;
  sendBtn.disabled = true;
  const replyBox = addMessage("assistant", "ربدان يفكر...");

  try {
    const response = await engine.chat.completions.create({
      messages: [
        { role: "system", content: systemPrompt },
        ...history.slice(-20)
      ],
      temperature: 0.7,
      max_tokens: 500
    });

    const answer =
      response.choices?.[0]?.message?.content || "ما قدرت أطلع رد، جرّب مرة ثانية.";

    replyBox.textContent = answer;
    history.push({ role: "assistant", content: answer });

  } catch (error) {
    replyBox.textContent = "صار خطأ: " + (error?.message || String(error));
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
});

clearBtn.addEventListener("click", () => {
  history = [];
  chat.innerHTML = "";
  addMessage("assistant", "تم مسح المحادثة. شو حاب تسألني؟ 🇦🇪");
});
</script>
</body>
</html>
