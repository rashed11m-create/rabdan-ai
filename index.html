<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>RABDAN AI 🇦🇪</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:#f4f7fb;
 font-family:Arial,sans-serif;min-height:100vh
}
header{
 padding:22px;text-align:center;
 border-bottom:1px solid #263347
}
header h1{color:#57e0c0;margin:0;font-size:25px}
header p{color:#91a2b8;font-size:12px}
main{max-width:760px;margin:auto;padding:20px}
.panel{
 background:#101a2b;border:1px solid #26364b;
 padding:18px;border-radius:16px;margin-bottom:18px
}
#status{
 color:#57e0c0;text-align:center;
 font-size:13px;line-height:1.8;margin:12px 0
}
.progress{
 width:100%;height:6px;background:#263347;
 border-radius:10px;overflow:hidden;margin:12px 0
}
#bar{height:100%;width:0;background:#57e0c0;transition:.3s}
button{
 border:0;border-radius:12px;padding:13px 18px;
 background:#57e0c0;color:#06151b;
 font-weight:bold;font-size:14px;cursor:pointer
}
button:disabled{opacity:.45;cursor:not-allowed}
#start{width:100%}
#chat{
 min-height:220px;max-height:48vh;
 overflow-y:auto;padding:8px
}
.msg{
 padding:13px 15px;border-radius:14px;
 margin:12px 0;line-height:1.8;
 white-space:pre-wrap;overflow-wrap:anywhere
}
.user{background:#183343;margin-right:25px}
.bot{background:#152033;margin-left:25px}
.controls{display:flex;gap:8px;margin-top:12px}
textarea{
 flex:1;min-width:0;resize:none;
 background:#142239;color:white;
 border:1px solid #35465b;border-radius:12px;
 padding:14px;font-size:15px;font-family:inherit
}
#send{min-width:75px}
#clear{
 background:#263347;color:white;
 width:100%;margin-top:10px
}
small{
 display:block;text-align:center;
 color:#8192a8;margin-top:13px;line-height:1.8
}
#error{
 color:#ff9999;font-size:12px;
 direction:ltr;overflow-wrap:anywhere
}
</style>
</head>

<body>
<header>
 <h1>🇦🇪 RABDAN AI</h1>
 <p>ذكاء اصطناعي محلي بهوية إماراتية</p>
</header>

<main>
 <section class="panel">
  <div id="status">ربدان غير مشغّل حالياً</div>
  <div class="progress"><div id="bar"></div></div>
  <button id="start">تشغيل ربدان</button>
  <div id="error"></div>
 </section>

 <section class="panel">
  <div id="chat"></div>
  <div class="controls">
   <textarea id="input" rows="2"
   placeholder="اكتب رسالتك إلى ربدان..." disabled></textarea>
   <button id="send" disabled>إرسال</button>
  </div>
  <button id="clear">مسح المحادثة</button>
 </section>

 <small>
  RABDAN AI · المحادثات محفوظة في متصفحك<br>
  يحتاج تحميل النموذج أول مرة واتصالاً بالإنترنت.
 </small>
</main>

<script type="module">
const MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";

const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const bar = document.getElementById("bar");
const startBtn = document.getElementById("start");
const sendBtn = document.getElementById("send");
const input = document.getElementById("input");
const chat = document.getElementById("chat");

let engine = null;
let history = [];

try {
 history = JSON.parse(
  localStorage.getItem("rabdan_history") || "[]"
 );
} catch {
 history = [];
}

function status(text) {
 statusEl.textContent = text;
}

function showMessage(text, type) {
 const div = document.createElement("div");
 div.className = "msg " + type;
 div.textContent = text;
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
}

history.forEach(message => {
 showMessage(
  message.content,
  message.role === "user" ? "user" : "bot"
 );
});

startBtn.addEventListener("click", startAI);
sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
 if (event.key === "Enter" && !event.shiftKey) {
  event.preventDefault();
  sendMessage();
 }
});

async function startAI() {
 startBtn.disabled = true;
 errorEl.textContent = "";
 bar.style.width = "2%";
 status("جاري تجهيز ربدان...");

 try {
  if (!navigator.gpu) {
   throw new Error("WebGPU غير متوفر في هذا المتصفح.");
  }

  status("جاري تحميل محرك الذكاء الاصطناعي...");

  const { CreateMLCEngine } =
   await import("https://esm.run/@mlc-ai/web-llm");

  status("جاري تحميل نموذج ربدان. قد يستغرق بعض الوقت...");

  engine = await CreateMLCEngine(MODEL, {
   initProgressCallback: progress => {
    if (progress.text) status(progress.text);

    if (typeof progress.progress === "number") {
     bar.style.width =
      Math.round(progress.progress * 100) + "%";
    }
   }
  });

  bar.style.width = "100%";
  status("ربدان جاهز للمحادثة! 🇦🇪");
  input.disabled = false;
  sendBtn.disabled = false;
  startBtn.textContent = "ربدان يعمل";

 } catch (error) {
  engine = null;
  startBtn.disabled = false;
  startBtn.textContent = "إعادة المحاولة";
  status("تعذر تشغيل ربدان.");

  errorEl.textContent =
   "ERROR: " + (error?.stack || error?.message || String(error));

  console.error("RABDAN ERROR:", error);
 }
}

async function sendMessage() {
 const text = input.value.trim();

 if (!text || !engine) return;

 input.value = "";
 input.disabled = true;
 sendBtn.disabled = true;

 showMessage(text, "user");

 history.push({role:"user", content:text});

 const systemPrompt = `
أنت ربدان، مساعد ذكاء اصطناعي مستقل بهوية إماراتية.
تحدث باللهجة الإماراتية عندما يتحدث المستخدم بالعربية.
كن ودوداً وواضحاً وصريحاً.
ساعد في الشرح والكتابة والتفكير والإبداع.
لا تدّع أنك تعرف معلومات لا تعرفها.
`;

 try {
  const messages = [
   {role:"system", content:systemPrompt},
   ...history.slice(-12)
  ];

  const result = await engine.chat.completions.create({
   messages,
   temperature:0.7,
   max_tokens:350
  });

  const answer =
   result.choices?.[0]?.message?.content ||
   "ما قدرت أجهز الرد، حاول مرة ثانية.";

  showMessage(answer, "bot");

  history.push({role:"assistant", content:answer});

  localStorage.setItem(
   "rabdan_history",
   JSON.stringify(history)
  );

 } catch(error) {
  showMessage("صار خطأ أثناء إنشاء الرد. حاول مرة ثانية.", "bot");
  console.error(error);
 }

 input.disabled = false;
 sendBtn.disabled = false;
 input.focus();
}

document.getElementById("clear").addEventListener("click", () => {
 history = [];
 localStorage.removeItem("rabdan_history");
 chat.innerHTML = "";
});
</script>
</body>
</html>
